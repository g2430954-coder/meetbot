name: GHOST meet Heavy Runner

on:
  repository_dispatch:
    types: [start_ghost_runner]

concurrency:
  group: ghost_meet_session
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    timeout-minutes: 360
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Cache Python Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb pulseaudio dbus-x11 x11vnc novnc ffmpeg

      - name: Fast Node Install
        run: npm install --no-audit --no-fund --quiet --prefer-offline

      - name: Fast Python Install
        run: pip install SpeechRecognition indic-transliteration --break-system-packages --quiet

      - name: Initialize Display & Audio & Visual Bridge
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          
          # Setup Virtual Audio
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          sleep 1
          pactl load-module module-virtual-sink sink_name=v_sink
          pactl set-default-sink v_sink
          
          # FORCE MAX VOLUME
          pactl set-sink-mute v_sink 0
          pactl set-sink-volume v_sink 100%
          pactl set-source-mute v_sink.monitor 0
          pactl set-source-volume v_sink.monitor 100%
          
          # VNC Server with auto-scaling
          x11vnc -display :99 -forever -shared -passwd "$VNC_PASSWORD" -bg -quiet
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6081 &

      - name: Setup SSH for Serveo
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan serveo.net >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Launch GHOST Runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_GROUP_ID: ${{ secrets.ALLOWED_GROUP_ID }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          MEETING_URL: ${{ github.event.client_payload.meeting_url }}
          DISPLAY_NAME: ${{ github.event.client_payload.display_name }}
          PLAYER_MESSAGE_ID: ${{ github.event.client_payload.player_message_id }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          DISPLAY: :99
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: node scripts/github_runner.js
